<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>민법 가이드 | 변리사 1차 민법개론 학습 코치</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6fb;
    --fg: #1a1a2e;
    --panel: #ffffff;
    --border: rgba(0,0,0,0.1);
    --muted: rgba(0,0,0,0.55);
    --brand: #3457d5;
    --brand-dark: #2a45ac;
    --brand-50: #eef4ff;
    --bubble-user: #3457d5;
    --bubble-user-fg: #ffffff;
    --bubble-bot: #ffffff;
    --error-bg: #fef2f2;
    --error-border: #fca5a5;
    --error-fg: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --fg: #e6e6ef;
      --panel: #171923;
      --border: rgba(255,255,255,0.1);
      --muted: rgba(255,255,255,0.55);
      --brand-50: rgba(255,255,255,0.06);
      --bubble-bot: rgba(255,255,255,0.08);
      --error-bg: rgba(239,68,68,0.12);
      --error-border: rgba(239,68,68,0.4);
      --error-fg: #fca5a5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  #app {
    max-width: 780px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header p { font-size: 12px; margin: 2px 0 0; color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
  }
  button.primary { background: var(--brand); color: #fff; }
  button.primary:hover { background: var(--brand-dark); }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.icon { padding: 8px 10px; background: transparent; border: 1px solid var(--border); color: var(--fg); }
  .material-banner {
    background: var(--brand-50);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .chat-log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 2px;
  }
  .empty-state {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.user .bubble { background: var(--bubble-user); color: var(--bubble-user-fg); }
  .msg-row.assistant .bubble { background: var(--bubble-bot); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .thinking .bubble { color: var(--muted); }
  .error-banner {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-fg);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .composer {
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  textarea {
    flex: 1;
    resize: none;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--fg);
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    outline: none;
  }
  textarea:focus { border-color: var(--brand); }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .modal-card {
    background: var(--panel);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--border);
  }
  .modal-card h2 { margin: 0 0 12px; font-size: 16px; }
  .modal-card label { display: block; font-size: 12px; margin: 12px 0 4px; color: var(--muted); }
  .modal-card input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
  }
  .modal-card .hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>민법 가이드</h1>
        <p>변리사 1차 민법개론 학습 코치</p>
      </div>
      <div class="actions">
        <input type="file" id="fileInput" accept=".pdf,.txt,application/pdf,text/plain" hidden />
        <button id="uploadBtn" class="primary">PDF/TXT 업로드</button>
        <button id="resetBtn" class="secondary" title="대화 초기화">초기화</button>
        <button id="settingsBtn" class="icon" title="API 설정">⚙</button>
      </div>
    </header>

    <div id="materialBanner" class="material-banner" hidden></div>
    <div id="errorBanner" class="error-banner" hidden></div>

    <div id="chatLog" class="chat-log">
      <div class="empty-state" id="emptyState">
        학습할 PDF 또는 TXT 자료를 업로드하면 논점 단위로 세션을 나눠 코칭을 시작합니다.<br />
        먼저 우측 상단 ⚙ 에서 Anthropic API 키를 설정해주세요.
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="2" placeholder="답변을 입력하세요 (Shift+Enter로 줄바꿈)"></textarea>
      <button id="sendBtn" class="primary">전송</button>
    </div>
  </div>

  <div id="settingsModal" class="modal" hidden>
    <div class="modal-card">
      <h2>API 설정</h2>
      <label>Anthropic API 키</label>
      <input id="apiKeyInput" type="password" placeholder="sk-ant-..." autocomplete="off" />
      <label>모델 ID</label>
      <input id="modelInput" type="text" value="claude-sonnet-4-5" />
      <p class="hint">
        키는 이 브라우저의 localStorage에만 저장되고, Anthropic API 호출 시에만 직접 전송됩니다.
        서버나 제3자에게 전달되지 않습니다. 공용 PC에서는 사용 후 초기화를 권장합니다.
      </p>
      <div class="modal-actions">
        <button id="closeSettingsBtn" class="secondary">닫기</button>
        <button id="saveSettingsBtn" class="primary">저장</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const SYSTEM_PROMPT = `너는 변리사 1차 민법개론 학습 코치다.

# 역할
사용자가 제공한 텍스트 또는 PDF 자료를 분석하고, 내용을 논점 단위로 분리하라. 자료의 양이 많으면 최대 10개의 10분 학습 세션으로 나누고, 10개를 초과하는 분량은 다음 학습 묶음으로 분리하라. 페이지 수가 아니라 개념의 독립성, 선행관계, 시험상 비교 필요성을 기준으로 세션을 구성하라.

# 세션 구성 순서
각 세션은 다음 순서로 구성한다.
1. 이번 세션에서 판단할 핵심 질문 1개
2. 핵심 요약: 의미, 요건, 법률효과, 예외, 시험 핵심어
3. 반드시 구별해야 할 유사 개념 비교
4. 기본 확인 문제
5. 사례형 문제
6. 변리사 1차형 5지선다 문제
7. 사용자가 자신의 말로 설명하는 문제
8. 틀리기 쉬운 선지와 오류 지점
9. 오늘의 암기 한 줄
10. 복습 시점 추천

# 정답 공개 원칙
사용자가 답하기 전에는 정답과 해설을 공개하지 않는다. 답을 받은 후에는 정오뿐 아니라 답변 근거, 핵심어 누락, 유사 개념 혼동, 확신도를 함께 평가한다.

# 문제 출처 구분
문제는 공식 기출, 기출 변형, AI 생성 문제를 명확히 구별한다. 공식 기출을 사용할 때는 시험 회차와 출처를 표시하고, 임의로 만든 문제를 실제 기출이라고 표현하지 않는다. 출처가 불확실하면 "출처 미상 - 추정 금지"라고 명시하라.

# 설명 원칙
설명은 정의만 나열하지 말고 실제 출제 포인트, 성립요건, 법률효과, 예외, 자주 바뀌는 선지 표현을 중심으로 한다. 업로드 자료와 현행 법령 또는 판례가 충돌할 가능성이 있으면 이를 명확히 경고하고, 불확실한 OCR 결과나 출처를 추측해서 확정하지 않는다.

# 이해도 강화 활동
사용자가 정답을 맞혀도 이해 여부를 확인하기 위해 필요에 따라 다음 활동을 추가한다.
- 틀린 선지 고치기
- 결론을 바꾸는 사실관계 찾기
- 반례 만들기
- 유사 개념과 비교하기
- 요건을 순서대로 재구성하기
- 사례를 자신의 말로 설명하기

# 목표
목표는 사용자가 내용을 읽었다고 느끼게 하는 것이 아니라, 변리사 1차 시험의 선지를 스스로 판단할 수 있게 만드는 것이다.

# 진행 방식
- 한 번에 세션 하나씩만 진행한다. 사용자가 문제에 답하기 전까지는 절대 다음 항목이나 정답을 먼저 보여주지 않는다.
- 사용자가 자료를 업로드하면, 먼저 전체 자료를 논점 단위로 나눈 "세션 목차"를 제시하고 세션 1부터 시작한다.
- 이미 대화가 진행 중이면 마지막으로 다룬 항목 이후부터 자연스럽게 이어간다.
- 답변은 한국어로 작성하고, 변리사 시험 특유의 용어와 표현을 사용한다.`;

    const SESSION_KICKOFF_HINT =
      "업로드된 자료를 논점 단위로 분석하여 세션 목차(최대 10개)를 먼저 제시하고, 세션 1의 1번 항목(핵심 질문)부터 시작하라.";

    const MAX_MATERIAL_CHARS = 180000;

    const state = {
      apiKey: localStorage.getItem("minbub_api_key") || "",
      model: localStorage.getItem("minbub_model") || "claude-sonnet-4-5",
      messages: JSON.parse(localStorage.getItem("minbub_messages") || "[]"),
      material: JSON.parse(localStorage.getItem("minbub_material") || "null"),
      loading: false,
      uploading: false,
    };

    const el = {
      fileInput: document.getElementById("fileInput"),
      uploadBtn: document.getElementById("uploadBtn"),
      resetBtn: document.getElementById("resetBtn"),
      settingsBtn: document.getElementById("settingsBtn"),
      materialBanner: document.getElementById("materialBanner"),
      errorBanner: document.getElementById("errorBanner"),
      chatLog: document.getElementById("chatLog"),
      emptyState: document.getElementById("emptyState"),
      input: document.getElementById("input"),
      sendBtn: document.getElementById("sendBtn"),
      settingsModal: document.getElementById("settingsModal"),
      apiKeyInput: document.getElementById("apiKeyInput"),
      modelInput: document.getElementById("modelInput"),
      closeSettingsBtn: document.getElementById("closeSettingsBtn"),
      saveSettingsBtn: document.getElementById("saveSettingsBtn"),
    };

    function persist() {
      localStorage.setItem("minbub_messages", JSON.stringify(state.messages));
      localStorage.setItem("minbub_material", JSON.stringify(state.material));
    }

    function showError(message) {
      el.errorBanner.textContent = message;
      el.errorBanner.hidden = false;
    }

    function clearError() {
      el.errorBanner.hidden = true;
      el.errorBanner.textContent = "";
    }

    function renderMaterialBanner() {
      if (!state.material) {
        el.materialBanner.hidden = true;
        return;
      }
      const m = state.material;
      let text = `자료 등록됨: ${m.filename}`;
      if (m.pageCount) text += ` · ${m.pageCount}페이지`;
      text += ` · ${m.charCount.toLocaleString()}자`;
      if (m.truncated) text += " (분량이 많아 일부만 반영됨 — 다음 학습 묶음으로 이어집니다)";
      el.materialBanner.textContent = text;
      el.materialBanner.hidden = false;
    }

    function renderMessages() {
      el.chatLog.innerHTML = "";
      if (state.messages.length === 0) {
        el.chatLog.appendChild(el.emptyState);
        return;
      }
      for (const m of state.messages) {
        const row = document.createElement("div");
        row.className = `msg-row ${m.role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = m.content;
        row.appendChild(bubble);
        el.chatLog.appendChild(row);
      }
      if (state.loading) {
        const row = document.createElement("div");
        row.className = "msg-row assistant thinking";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = "생각하는 중...";
        row.appendChild(bubble);
        el.chatLog.appendChild(row);
      }
      el.chatLog.scrollTop = el.chatLog.scrollHeight;
    }

    function setLoading(v) {
      state.loading = v;
      el.sendBtn.disabled = v;
      el.uploadBtn.disabled = v || state.uploading;
      renderMessages();
    }

    function setUploading(v) {
      state.uploading = v;
      el.uploadBtn.disabled = v;
      el.uploadBtn.textContent = v ? "업로드 중..." : "PDF/TXT 업로드";
    }

    function openSettings() {
      el.apiKeyInput.value = state.apiKey;
      el.modelInput.value = state.model;
      el.settingsModal.hidden = false;
    }

    function closeSettings() {
      el.settingsModal.hidden = true;
    }

    el.settingsBtn.addEventListener("click", openSettings);
    el.closeSettingsBtn.addEventListener("click", closeSettings);
    el.saveSettingsBtn.addEventListener("click", () => {
      state.apiKey = el.apiKeyInput.value.trim();
      state.model = el.modelInput.value.trim() || "claude-sonnet-4-5";
      localStorage.setItem("minbub_api_key", state.apiKey);
      localStorage.setItem("minbub_model", state.model);
      closeSettings();
      clearError();
    });

    el.resetBtn.addEventListener("click", () => {
      if (!confirm("대화와 업로드한 자료를 모두 초기화할까요?")) return;
      state.messages = [];
      state.material = null;
      persist();
      renderMaterialBanner();
      renderMessages();
      clearError();
    });

    async function extractPdfText(file) {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const strings = content.items.map((item) => ("str" in item ? item.str : ""));
        text += strings.join(" ") + "\n\n";
      }
      return { text, pageCount: pdf.numPages };
    }

    el.uploadBtn.addEventListener("click", () => el.fileInput.click());

    el.fileInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      clearError();
      setUploading(true);
      try {
        const lower = file.name.toLowerCase();
        let text = "";
        let pageCount;
        if (lower.endsWith(".pdf") || file.type === "application/pdf") {
          const result = await extractPdfText(file);
          text = result.text;
          pageCount = result.pageCount;
        } else if (lower.endsWith(".txt") || file.type === "text/plain" || file.type === "") {
          text = await file.text();
        } else {
          throw new Error("PDF 또는 TXT 파일만 업로드할 수 있습니다.");
        }

        text = text.replace(/\r\n/g, "\n").trim();
        if (!text) {
          throw new Error(
            "파일에서 텍스트를 추출하지 못했습니다. 스캔 이미지로만 이루어진 PDF는 지원되지 않습니다(OCR 미지원)."
          );
        }

        let truncated = false;
        if (text.length > MAX_MATERIAL_CHARS) {
          text = text.slice(0, MAX_MATERIAL_CHARS);
          truncated = true;
        }

        state.material = {
          filename: file.name,
          text,
          charCount: text.length,
          truncated,
          pageCount,
        };
        renderMaterialBanner();
        persist();

        await sendMessage(
          "방금 업로드한 자료를 분석해서 세션 목차를 먼저 제시하고, 세션 1의 핵심 질문부터 시작해줘.",
          true
        );
      } catch (err) {
        showError(err.message || "파일 처리 중 오류가 발생했습니다.");
      } finally {
        setUploading(false);
        el.fileInput.value = "";
      }
    });

    function buildSystemPrompt(isKickoff) {
      let sys = SYSTEM_PROMPT;
      if (state.material && state.material.text) {
        sys += `\n\n# 업로드된 학습 자료\n파일명: ${state.material.filename}\n`;
        if (state.material.truncated) {
          sys += "(참고: 자료가 길어 앞부분 일부만 전달됨. 이후 후속 업로드로 이어질 수 있음)\n";
        }
        sys += `<document>\n${state.material.text}\n</document>`;
        if (isKickoff) sys += `\n\n${SESSION_KICKOFF_HINT}`;
      }
      return sys;
    }

    async function sendMessage(text, isKickoff) {
      const trimmed = (text || "").trim();
      if (!trimmed || state.loading) return;

      if (!state.apiKey) {
        showError("먼저 ⚙ 설정에서 Anthropic API 키를 입력해주세요.");
        openSettings();
        return;
      }

      clearError();
      state.messages.push({ role: "user", content: trimmed });
      persist();
      renderMessages();

      setLoading(true);
      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "x-api-key": state.apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: state.model,
            max_tokens: 4096,
            system: buildSystemPrompt(isKickoff),
            messages: state.messages.map((m) => ({ role: m.role, content: m.content })),
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error((data && data.error && data.error.message) || "응답을 받지 못했습니다.");
        }

        const textBlock = (data.content || []).find((b) => b.type === "text");
        const reply = textBlock ? textBlock.text : "";
        state.messages.push({ role: "assistant", content: reply });
        persist();
      } catch (err) {
        showError(err.message || "챗봇 응답 중 오류가 발생했습니다.");
      } finally {
        setLoading(false);
      }
    }

    el.sendBtn.addEventListener("click", () => {
      const value = el.input.value;
      el.input.value = "";
      sendMessage(value, false);
    });

    el.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const value = el.input.value;
        el.input.value = "";
        sendMessage(value, false);
      }
    });

    renderMaterialBanner();
    renderMessages();
    if (!state.apiKey) {
      setTimeout(openSettings, 300);
    }
  </script>
</body>
</html>
