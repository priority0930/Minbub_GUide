<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>의료법 이지선다</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f7;
  --card: #ffffff;
  --fg: #171717;
  --mute: #6e6e6e;
  --line: #d9d9d9;
  --solid: #171717;
  --solid-fg: #ffffff;
  --teal: #0d9488;
  --teal-soft: rgba(13, 148, 136, .12);
  --coral: #e5604c;
  --coral-soft: rgba(229, 96, 76, .12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101010;
    --card: #1b1b1b;
    --fg: #ededed;
    --mute: #9a9a9a;
    --line: #333333;
    --solid: #ededed;
    --solid-fg: #101010;
    --teal: #2cb8a9;
    --teal-soft: rgba(44, 184, 169, .16);
    --coral: #ff7d69;
    --coral-soft: rgba(255, 125, 105, .16);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }

#app { max-width: 480px; margin: 0 auto; }
.screen {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding:
    calc(16px + env(safe-area-inset-top))
    calc(20px + env(safe-area-inset-right))
    calc(16px + env(safe-area-inset-bottom))
    calc(20px + env(safe-area-inset-left));
}
.grow { flex: 1 1 auto; min-height: 16px; }

/* 시작 */
h1 { font-size: 22px; margin: 24px 0 28px; letter-spacing: -.02em; }
.label { font-size: 12px; color: var(--mute); margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.chip {
  min-height: 40px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font-size: 14px;
  word-break: keep-all;
}
.chip[aria-pressed="true"] { background: var(--solid); border-color: var(--solid); color: var(--solid-fg); }
.chip:disabled { opacity: .35; cursor: default; }
.seg { display: flex; gap: 8px; margin-bottom: 24px; }
.seg .chip { flex: 1 1 0; border-radius: 12px; }
.primary, .ghost {
  width: 100%;
  min-height: 56px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
}
.primary { border: 0; background: var(--solid); color: var(--solid-fg); }
.ghost { border: 1px solid var(--line); background: var(--card); margin-top: 10px; }
.primary:disabled, .ghost:disabled { opacity: .35; cursor: default; }
footer { margin-top: 16px; font-size: 11px; color: var(--mute); text-align: center; word-break: keep-all; }

/* 문제 */
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .2s ease; }
.meta { display: flex; align-items: center; gap: 8px; margin: 10px 0 28px; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  color: var(--mute);
}
.quit { margin-left: auto; width: 36px; height: 36px; border: 0; background: none; color: var(--mute); font-size: 16px; }
#q { font-size: 19px; font-weight: 600; line-height: 1.4; margin: 0; letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  width: 100%;
  min-height: 60px;
  padding: 12px 16px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  font-size: 17px;
  text-align: center;
  word-break: keep-all;
  overflow-wrap: anywhere;
  transition: background .12s, border-color .12s, color .12s;
}
.opt:active { transform: scale(.985); }
.opt.ok { background: var(--teal); border-color: var(--teal); color: #fff; }
.opt.bad { background: var(--coral); border-color: var(--coral); color: #fff; }
.fb { min-height: 104px; padding-top: 12px; }
.fb-in { visibility: hidden; }
.fb.on .fb-in { visibility: visible; }
#exp { margin: 0 0 8px; font-size: 14px; color: var(--mute); word-break: keep-all; overflow-wrap: anywhere; }
.fbrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.next { min-height: 36px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 14px; }

/* 결과 */
.score { text-align: center; margin-top: 18vh; }
.score b { display: block; font-size: 56px; line-height: 1.1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score span { display: block; margin-top: 8px; font-size: 16px; color: var(--mute); }

:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app">

  <section id="s-start" class="screen">
    <h1>의료법 이지선다</h1>
    <p class="label">범위</p>
    <div id="scope" class="chips"></div>
    <p class="label">문항</p>
    <div id="count" class="seg">
      <button class="chip" data-n="20">20</button>
      <button class="chip" data-n="40">40</button>
      <button class="chip" data-n="all">전체</button>
    </div>
    <p class="label">모드</p>
    <div id="mode" class="seg">
      <button class="chip" data-m="normal">일반</button>
      <button class="chip" data-m="wrong">오답만</button>
    </div>
    <div class="grow"></div>
    <button id="go" class="primary">시작</button>
    <footer>기준: 의료법(2026.4.7)·시행규칙(2026.6.12)·간호법 / 제34조 2026.12.24 개정 반영</footer>
  </section>

  <section id="s-quiz" class="screen" hidden>
    <div class="bar"><i id="prog"></i></div>
    <div class="meta">
      <span id="num"></span>
      <span id="chip" class="tag"></span>
      <button id="quit" class="quit" aria-label="나가기">✕</button>
    </div>
    <h2 id="q"></h2>
    <div class="grow"></div>
    <div class="opts">
      <button id="o0" class="opt"></button>
      <button id="o1" class="opt"></button>
    </div>
    <div id="fb" class="fb" aria-live="polite">
      <div class="fb-in">
        <p id="exp"></p>
        <div class="fbrow">
          <span id="ref" class="tag"></span>
          <button id="next" class="next">다음</button>
        </div>
      </div>
    </div>
  </section>

  <section id="s-result" class="screen" hidden>
    <div class="score">
      <b id="r-score"></b>
      <span id="r-rate"></span>
    </div>
    <div class="grow"></div>
    <button id="retry" class="primary">틀린 문제만 다시</button>
    <button id="home" class="ghost">처음으로</button>
    <footer>기준: 의료법(2026.4.7)·시행규칙(2026.6.12)·간호법 / 제34조 2026.12.24 개정 반영</footer>
  </section>

</main>

{"id":"C31","ch":"C","ref":"시행규칙 제15조","q":"환자 명부 보존기간은?","a":"5년","b":"3년","exp":"검사소견기록·방사선사진도 5년"}
]/*DATA-END*/;

const CHAPTERS = [
  ['A', '총칙'], ['B', '자격·면허'], ['C', '권리·의무'], ['D', '의료행위·단체'],
  ['E', '의료기관'], ['F', '법인·광고·인증·감독'], ['N', '간호법 연계']
];
const STORE_KEY = 'medlaw-quiz-wrong-v1';
const AUTO_NEXT_MS = 500;
const TAP_GUARD_MS = 300;
const MAX_SAME_SIDE = 3;

const $ = (id) => document.getElementById(id);
const byId = new Map(QUESTIONS.map((x) => [x.id, x]));

/* ---------- 오답 저장소 (실패해도 메모리 값으로 계속 동작) ---------- */
let wrong = loadWrong();
function loadWrong() {
  try {
    const o = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    if (!o || typeof o !== 'object' || Array.isArray(o)) return {};
    const out = {};
    for (const k of Object.keys(o)) {
      const n = Math.floor(Number(o[k]));
      if (n > 0) out[k] = n;
    }
    return out;
  } catch (e) {
    return {};
  }
}
function saveWrong() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(wrong)); } catch (e) { /* 무시 */ }
}
function markWrong(id) { wrong[id] = (wrong[id] || 0) + 1; saveWrong(); }
function markRight(id) {
  if (!wrong[id]) return;
  if (wrong[id] <= 1) delete wrong[id]; else wrong[id] -= 1;
  saveWrong();
}
function isWrong(x) { return (wrong[x.id] || 0) > 0; }

/* ---------- 유틸 ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function refLabel(ref) { return ref.startsWith('간호법') ? ref : '의료법 ' + ref; }
function show(id) {
  for (const s of ['s-start', 's-quiz', 's-result']) $(s).hidden = s !== id;
  window.scrollTo(0, 0);
}

/* ---------- 시작 화면 ---------- */
const setup = { scope: new Set(), count: '20', mode: 'normal' }; // scope 비어 있음 = 전체

function pool() {
  let list = QUESTIONS;
  if (setup.scope.size) list = list.filter((x) => setup.scope.has(x.ch));
  if (setup.mode === 'wrong') list = list.filter(isWrong);
  return list;
}

function buildScope() {
  const box = $('scope');
  const mk = (key, text) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.ch = key;
    b.textContent = text;
    box.appendChild(b);
    return b;
  };
  mk('', '전체');
  for (const [ch, name] of CHAPTERS) {
    const b = mk(ch, ch + ' ' + name);
    b.disabled = !QUESTIONS.some((x) => x.ch === ch);
  }
  box.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const ch = b.dataset.ch;
    if (!ch) setup.scope.clear();
    else if (setup.scope.has(ch)) setup.scope.delete(ch);
    else setup.scope.add(ch);
    refreshStart();
  });
}

function refreshStart() {
  if (!QUESTIONS.some(isWrong)) setup.mode = 'normal';
  for (const b of $('scope').children) {
    const ch = b.dataset.ch;
    b.setAttribute('aria-pressed', String(ch ? setup.scope.has(ch) : setup.scope.size === 0));
  }
  for (const b of $('count').children) b.setAttribute('aria-pressed', String(b.dataset.n === setup.count));
  for (const b of $('mode').children) {
    b.setAttribute('aria-pressed', String(b.dataset.m === setup.mode));
    if (b.dataset.m === 'wrong') b.disabled = !QUESTIONS.some(isWrong);
  }
  $('go').disabled = pool().length === 0;
}

$('count').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) { setup.count = b.dataset.n; refreshStart(); }
});
$('mode').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b && !b.disabled) { setup.mode = b.dataset.m; refreshStart(); }
});
$('go').addEventListener('click', () => {
  const list = pool();
  if (!list.length) return;
  const n = setup.count === 'all' ? list.length : Math.min(Number(setup.count), list.length);
  startSession(shuffle(list).slice(0, n));
});

/* ---------- 문제 화면 ---------- */
let S = null;      // 현재 세션
let timer = 0;

function startSession(items) {
  clearTimeout(timer);
  S = { items, i: 0, correct: 0, missed: [], pos: 0, lastPos: -1, run: 0, state: 'answer', at: 0 };
  show('s-quiz');
  render();
}

function render() {
  const x = S.items[S.i];
  // 선택지 셔플 + 정답이 같은 쪽에 MAX_SAME_SIDE번 넘게 연속되지 않게 보정
  let pos = Math.random() < 0.5 ? 0 : 1;
  if (pos === S.lastPos && S.run >= MAX_SAME_SIDE) pos = 1 - pos;
  S.run = pos === S.lastPos ? S.run + 1 : 1;
  S.lastPos = pos;
  S.pos = pos;
  S.state = 'answer';

  $('prog').style.width = ((S.i + 1) / S.items.length * 100) + '%';
  $('num').textContent = (S.i + 1) + '/' + S.items.length;
  $('chip').textContent = x.ch;
  $('q').textContent = x.q;
  const o = [$('o0'), $('o1')];
  o[pos].textContent = x.a;
  o[1 - pos].textContent = x.b;
  o[0].className = o[1].className = 'opt';
  $('fb').classList.remove('on');
}

function pick(k) {
  if (!S || S.state !== 'answer') return;
  const x = S.items[S.i];
  const o = [$('o0'), $('o1')];
  o[k].blur();
  if (k === S.pos) {
    o[k].classList.add('ok');
    S.correct += 1;
    markRight(x.id);
    S.state = 'lock';
    timer = setTimeout(advance, AUTO_NEXT_MS);
  } else {
    o[k].classList.add('bad');
    o[S.pos].classList.add('ok');
    S.missed.push(x);
    markWrong(x.id);
    $('exp').textContent = x.exp;
    $('exp').hidden = !x.exp;
    $('ref').textContent = refLabel(x.ref);
    $('fb').classList.add('on');
    S.state = 'review';
    S.at = Date.now();
  }
}

function advance() {
  if (!S) return;
  clearTimeout(timer);
  S.i += 1;
  if (S.i >= S.items.length) finish(); else render();
}

function finish() {
  const total = S.items.length;
  $('r-score').textContent = S.correct + '/' + total;
  $('r-rate').textContent = '정답률 ' + Math.round(S.correct / total * 100) + '%';
  $('retry').disabled = S.missed.length === 0;
  S.state = 'done';
  show('s-result');
}

function goHome() {
  clearTimeout(timer);
  S = null;
  refreshStart();
  show('s-start');
}

$('o0').addEventListener('click', () => pick(0));
$('o1').addEventListener('click', () => pick(1));
$('quit').addEventListener('click', (e) => { e.stopPropagation(); goHome(); });
// 오답 해설 상태에서는 화면 아무 곳이나(또는 [다음]) 탭하면 진행.
// 오답을 고른 바로 그 탭이 여기까지 올라와 즉시 넘어가지 않도록 짧은 가드를 둔다.
$('s-quiz').addEventListener('click', () => {
  if (S && S.state === 'review' && Date.now() - S.at > TAP_GUARD_MS) advance();
});

document.addEventListener('keydown', (e) => {
  if ($('s-quiz').hidden || !S || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '1' || e.key === 'ArrowLeft') { e.preventDefault(); pick(0); }
  else if (e.key === '2' || e.key === 'ArrowRight') { e.preventDefault(); pick(1); }
  else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (S.state === 'review') advance();
  }
});

/* ---------- 결과 화면 ---------- */
$('retry').addEventListener('click', () => {
  if (S && S.missed.length) startSession(shuffle(S.missed));
});
$('home').addEventListener('click', goHome);

buildScope();
refreshStart();
</script>
